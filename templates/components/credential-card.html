{% component credential_card(group: map) %}
<article class="cert-card corner-ticks" data-reveal="fade-up"{% if group.delay %} data-reveal-delay="{{ group.delay }}"{% endif %}>
    <div class="cert-head">
        <div class="cert-logo"><img src="{{ get_url(path=group.image) }}" alt="{{ group.alt }}"></div>
        <div><h3>{{ group.title }}</h3><p class="cert-issuer">{{ group.issuer }}</p></div>
    </div>
    <ul class="cert-rows">
        {% for row in group.rows %}<li>{{ row.label }} <code>{{ row.code }}</code></li>{% endfor %}
    </ul>
    {% if group.url %}<a href="{{ group.url }}" class="btn btn-small" target="_blank" rel="noopener">{{ group.link_label }} <span aria-hidden="true">&#8599;</span></a>{% endif %}
</article>
{% endcomponent credential_card %}
