name: Verify portfolio

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      pages_artifact:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Visual baselines are rebuilt from the original source revision.
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - name: Install pinned Zola
        run: bash scripts/install-zola.sh
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run check
        env:
          ZOLA_BIN: .tools/zola
      - run: npm test
        env:
          ZOLA_BIN: .tools/zola
      - uses: actions/upload-pages-artifact@v4
        if: inputs.pages_artifact
        with:
          path: public
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
